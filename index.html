<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINE AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <header>
        <h1>MINE</h1>
        <p>Your AI companion</p>
    </header>

    <div class="character">
        <div>
            <h2>Hi! I'm MINE 💜</h2>
            <p>I'm here with you.</p>
        </div>
    </div>

    <div class="chat">
        
        <button onclick="clearChat()">🗑️ 
            Clear Chat</button>

        <div id="messages">
            <div class="message">
                MINE: Hello! 💜
            </div>
        </div>

        <div class="controls">
            <input
                id="userInput"
                type="text"
                placeholder="Talk to MINE..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>
<script src="script.js"></script>

</body>
                </html>
